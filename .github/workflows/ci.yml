name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: office_tracker_test
          POSTGRES_USER: office_tracker_test_owner
          # Disposable job-local database, isolated from production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_tracker_test_owner -d office_tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, lint and build with the frozen lockfile
        run: docker build --target build -t office-tracker:checks .
      - name: Check formatting and database-backed API behavior
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgres://office_tracker_test_owner@127.0.0.1:5432/office_tracker_test \
            office-tracker:checks sh -c 'bun run format:check && bun run test:integration'
      - name: Verify application deployment hooks (engine gates run in deploy-core)
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Verify webhook authentication and queue limits
        run: |
          docker run --rm -v "$PWD/deploy/receiver:/app:ro" -w /app \
            node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 \
            node --test server.test.mjs
      - name: Build the production runtime without publishing
        run: docker build --build-arg OFFICE_TRACKER_REVISION="$GITHUB_SHA" -t office-tracker:ci .
