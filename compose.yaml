name: office-tracker
services:
  web:
    image: ${OFFICE_TRACKER_IMAGE:?Select a release using deploy/release.py}
    user: '501:20'
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: '3000'
      TZ: Europe/London
      DATABASE_URL: postgres://office_tracker_runtime@postgres:5432/office_tracker
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    networks:
      platform-web:
        aliases: [office-tracker]
      platform-db: {}
    # Inherit the health check shipped with the application image.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  database_password:
    file: ../../projects/office_tracker/runtime-password
networks:
  platform-web:
    external: true
  platform-db:
    external: true
